<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="../utils/input_actions.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <input type="text" cstm-data-copy="x1" value="AAA">
  <button cstm-data-copy-btn="x1">Copy Text</button>
  <input type="text" cstm-data-copy="x2" value="BBB">
  <button cstm-data-copy-btn="x2">Copy Text</button>
  <input type="text" cstm-data-clear="x3" value="CCC">
  <button cstm-data-clear-btn="x3">Clear</button>
  <input type="text" cstm-data-clear="x4" value="DDD">
  <button cstm-data-clear-btn="x4">Clear</button>

  <form>
    <div>
      <input type="text" cstm-split-input="otp" cstm-split-input-index="1" maxlength="1">
      <input type="text" cstm-split-input="otp" cstm-split-input-index="2" maxlength="1">
      <input type="text" cstm-split-input="otp" cstm-split-input-index="3" maxlength="1">
      <input type="text" cstm-split-input="otp" cstm-split-input-index="4" maxlength="1">
    </div>
    <input type="text" cstm-split-input-join="otp" value="abc123">
  </form>
  <form>
    <div>
      <input type="text" cstm-split-input="otp2" cstm-split-input-index="1" maxlength="1">
      <input type="text" cstm-split-input="otp2" cstm-split-input-index="2" maxlength="1">
      <input type="text" cstm-split-input="otp2" cstm-split-input-index="3" maxlength="1">
      <input type="text" cstm-split-input="otp2" cstm-split-input-index="4" maxlength="1">
    </div>
    <input type="text" cstm-split-input-join="otp2">
  </form>

  <button type="submit" cstmtag-button-loading="" class="btn btn-primary mt-4 w-100">
    <span class="cstmtag-icon-main">
      Verify
    </span>
    <span class="cstmtag-loading-indicator d-none" hidden="">
      <span aria-hidden="true" hidden="" class="spinner-border spinner-border-sm"></span>
      <span role="status">Loading...</span>
    </span>
  </button>
</body>
</html>
